name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node test.js
      # main.js needs StarUML to run: syntax only (the Self-Test command covers it inside StarUML)
      - run: node --check main.js

  # Each version of package.json gets one release (v0.9.0...), which Install From URL and the StarUML registry use
  release:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release the package.json version unless it already is
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already released: bump the version in package.json for a new release"
          else
            git log -1 --format=%B | grep -v '^Co-Authored-By:' > notes.md
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
